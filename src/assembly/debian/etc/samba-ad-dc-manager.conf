##
## Defines the port of the server (default is 8080).
##
SERVER_PORT=8080

##
## Defines the active profiles.
## These profiles are available:
## - 'debian': should always be enabled if the service runs directly on a debian machine
## - 'mock': the initial profile, the service should start without any configuration, but has no interaction with the domain controller/active directory
## - 'local': use this profile if the service runs on the same machine as the samba-ad-dc service
## - 'remote': use this profile if the service runs on another machine as the samba-ad-dc service (requires proper ssh configuration)
## - 'mail': configures a smtp connection to send e-mails
## - 'api': enables the RESTful endpoints of the samba ad dc manager
## - 'jwt': enables authentication via json web tokens for the api endpoints (requires an openid server like keycloak)
##
ACTIVE_PROFILES="debian,mock"
# Basic configuration:
#ACTIVE_PROFILES="debian,local"
# Basic configuration with e-mail support:
#ACTIVE_PROFILES="debian,local,mail"

##
##
## Configure these settings for profile 'local' or 'remote':
##

# Url of ldap interface
#BREMERSEE_LDAPTIVE_LDAP_URL="ldaps://localhost:636"

# Specify trust certificates, if they are not signed by an official signer:
BREMERSEE_LDAPTIVE_SSL_CONFIG_TRUST_CERTIFICATES="file:/var/lib/samba/private/tls/ca.pem,file:/var/lib/samba/private/tls/cert.pem"

# Set to 'default' if the hostname of the ldap url matches the certificate, otherwise use 'allow_any' (risky!)
BREMERSEE_LDAPTIVE_SSL_CONFIG_HOSTNAME_VERIFIER="allow_any"

# Enter the bind dn of an administrator:
BREMERSEE_LDAPTIVE_BIND_DN="Administrator@samdom.example.org"

# Enter the password of the administrator:
BREMERSEE_LDAPTIVE_BIND_CREDENTIALS="change-it"

# Set the base dn:
BREMERSEE_DC_BASE_DN="dc=samdom,dc=example,dc=org"

# Set a company or organisation name:
BREMERSEE_DC_COMPANY_NAME="Samba AD DC Manager"

# Set a link to your homepage:
BREMERSEE_DC_COMPANY_URL="#"

# Add a long secret for encrypting callback urls in mails (like resetting the password):
BREMERSEE_DC_CRYPTO_SECRET="change-it"

# Add some reserved user names:
BREMERSEE_DC_DOMAIN_FORBIDDEN_NEW_SAM_ACCOUNT_NAMES_0="root"
BREMERSEE_DC_DOMAIN_FORBIDDEN_NEW_SAM_ACCOUNT_NAMES_1="admin"
BREMERSEE_DC_DOMAIN_FORBIDDEN_NEW_SAM_ACCOUNT_NAMES_2="guest"

# Enter the hostname of the domain controller, if you use profile 'remote':
#BREMERSEE_DC_DOMAIN_HOST_NAME="localhost"

# Specify whether a user should be able to change it's e-mail address:
BREMERSEE_DC_USER_USER_ABLE_TO_CHANGE_EMAIL=true

# Set a default language:
BREMERSEE_DC_USER_USER_DEFAULT_LANGUAGE="de-DE"

# Set an alternative login url (default is the login page of the manager):
#BREMERSEE_DC_USER_USER_DEFAULT_LOGIN_PAGE_URL=""
#BREMERSEE_DC_USER_USER_DEFAULT_LOGIN_PAGE_NAME=""
#BREMERSEE_DC_USER_USER_DEFAULT_LOGIN_PAGE_USING_NETBIOS_DOMAIN_PREFIX=false

# Must be 'true' for profile 'local', on profile 'remote' it depends on the ssh user:
BREMERSEE_DC_CLI_SUDO_USING_SUDO=true
BREMERSEE_DC_CLI_SUDO_SUDO_COMMAND="/usr/bin/sudo"

# Must be 'false' for profile 'local', on profile 'remote' it must be 'true' and requires proper ssh configuration:
BREMERSEE_DC_CLI_SSH_USING_SSH=false
#BREMERSEE_DC_CLI_SSH_SSH_COMMAND="/usr/bin/ssh root@$BREMERSEE_DC_DOMAIN_HOST_NAME"

# Some binaries (no changes are required on a normal debian system):
BREMERSEE_DC_CLI_HOSTNAME_BINARY="/usr/bin/hostname"
BREMERSEE_DC_CLI_DHCP_LEASE_LIST_BINARY="/usr/sbin/dhcp-lease-list"
BREMERSEE_DC_CLI_SAMBA_TOOL_BINARY="/usr/bin/samba-tool"

# Some samba-tool operations require the username and the password of an administrator.
# Adjust username and password:
BREMERSEE_DC_CLI_SAMBA_TOOL_CREDENTIALS_OPTIONS="-UAdministrator --password=$BREMERSEE_LDAPTIVE_BIND_CREDENTIALS"

# Define a secret key for the remember-me functionality:
#BREMERSEE_AUTHENTICATION_REMEMBER_ME_KEY="change-it"
#BREMERSEE_AUTHENTICATION_REMEMBER_ME_COOKIE_NAME=
#BREMERSEE_AUTHENTICATION_REMEMBER_ME_COOKIE_DOMAIN=


## No interaction with the domain controller/active directory
ACTIVE_PROFILES="debian,mock"
#
BREMERSEE_LDAPTIVE_LDAP_URL="ldaps://localhost:636"
BREMERSEE_LDAPTIVE_SSL_CONFIG_TRUST_CERTIFICATES="file:/var/lib/samba/private/tls/ca.pem,file:/var/lib/samba/private/tls/cert.pem"
BREMERSEE_LDAPTIVE_SSL_CONFIG_HOSTNAME_VERIFIER="allow_any"
BREMERSEE_LDAPTIVE_BIND_DN="Administrator@samdom.example.org"
BREMERSEE_LDAPTIVE_BIND_CREDENTIALS="change-it"
BREMERSEE_AUTHENTICATION_REMEMBER_ME_KEY="change-it"
#BREMERSEE_AUTHENTICATION_REMEMBER_ME_COOKIE_NAME=
#BREMERSEE_AUTHENTICATION_REMEMBER_ME_COOKIE_DOMAIN=
BREMERSEE_DC_BASE_DN="dc=samdom,dc=example,dc=org"
BREMERSEE_DC_COMPANY_NAME="Samba AD DC Manager"
BREMERSEE_DC_COMPANY_URL="#"
BREMERSEE_DC_COMPANY_CRYPTO_SECRET="change-it"
BREMERSEE_DC_DOMAIN_FORBIDDEN_NEW_SAM_ACCOUNT_NAMES_0="root"
BREMERSEE_DC_DOMAIN_FORBIDDEN_NEW_SAM_ACCOUNT_NAMES_1="admin"
BREMERSEE_DC_DOMAIN_FORBIDDEN_NEW_SAM_ACCOUNT_NAMES_2="guest"
#BREMERSEE_DC_DOMAIN_HOST_NAME="localhost"
BREMERSEE_DC_USER_USER_ABLE_TO_CHANGE_EMAIL=true
BREMERSEE_DC_USER_USER_DEFAULT_LANGUAGE="de-DE"
BREMERSEE_DC_USER_USER_DEFAULT_LOGIN_PAGE_URL=""
BREMERSEE_DC_USER_USER_DEFAULT_LOGIN_PAGE_NAME=""
BREMERSEE_DC_USER_USER_DEFAULT_LOGIN_PAGE_USING_NETBIOS_DOMAIN_PREFIX=false
BREMERSEE_DC_CLI_SUDO_USING_SUDO=true
BREMERSEE_DC_CLI_SUDO_SUDO_COMMAND="/usr/bin/sudo"
BREMERSEE_DC_CLI_SSH_USING_SSH=false
#BREMERSEE_DC_CLI_SSH_SSH_COMMAND="/usr/bin/ssh root@$BREMERSEE_DC_DOMAIN_HOST_NAME"
BREMERSEE_DC_CLI_HOSTNAME_BINARY="/usr/bin/hostname"
BREMERSEE_DC_CLI_DHCP_LEASE_LIST_BINARY="/usr/sbin/dhcp-lease-list"
BREMERSEE_DC_CLI_SAMBA_TOOL_BINARY="/usr/bin/samba-tool"
BREMERSEE_DC_CLI_SAMBA_TOOL_CREDENTIALS_OPTIONS="-UAdministrator --password=$BREMERSEE_LDAPTIVE_BIND_CREDENTIALS"
SERVER_PORT=8080
#
SPRINGDOC_OPEN_API_SERVERS_0_URL="http://localhost:8080"
SPRINGDOC_OPEN_API_SERVERS_0_DESCRIPTION="Samba AD DC Manager API"


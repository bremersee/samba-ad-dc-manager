bremersee:
  ldaptive:
    ldaptive-template-class: org.bremersee.ldaptive.LdaptiveSambaTemplate
    immutable: true
    use-start-tls: ${LDAP_START_TLS:false}
    bind-dn: ${LDAP_BIND_DN:Administrator}
    bind-credentials: ${LDAP_BIND_PASSWORD:changeit}
    pooled: ${LDAP_POOLED:false}
    connection-validator:
      search-request:
        base-dn: ${bremersee.dc.base-dn}
    connection-pool:
      min-pool-size: 3
      max-pool-size: 10
      validate-on-check-in: false
      validate-on-check-out: false
      validate-periodically: true
      validator:
        search-request:
          base-dn: ${bremersee.dc.base-dn}
  authentication:
    remember-me:
      key: ${LDAP_REMEMBER_ME:${spring.application.name}}
    ldaptive:
      template: active_directory
      user-base-dn: ${bremersee.dc.base-dn}
      user-find-one-search-scope: subtree
      role-prefix: "ROLE_"
      role-case-transformation: to_upper_case
      role-string-replacements:
        - regex: "[- ]"
          replacement: "_"
        - regex: "_ADMINS"
          replacement: "_ADMIN"
      default-roles:
        - "ROLE_LOCAL_USER"
      role-mapping:
        - source: "Domain Admins"
          target: "ROLE_ADMIN"
        - source: "samba-admins"
          target: "ROLE_ADMIN"
  dc:
    base-dn: ${LDAP_BASE_DN:dc=eixe,dc=bremersee,dc=org}
    company-name: ${COMPANY_NAME:}
    company-url: ${COMPANY_URL:}
    cli:
      samba-tool-credentials-options: "-UAdministrator --password='${bremersee.ldaptive.bind-credentials}'"

  exception-mapping:
    api-paths:
      - /api/**
    default-exception-mapping-config:
      include-message: true
      include-exception: true
      include-application-name: true
      include-path: true
      include-handler: true
      include-stack-trace: true
      include-cause: true

  comparator:
    converter:
      argument-separator: ","
      chain-separator: ";"

eureka:
  client:
    enabled: false

spring:
  profiles:
    default: mock
  application:
    name: ${APPLICATION_NAME:samba-ad-dc-manager}
  cache:
    jcache:
      config: classpath:ehcache.xml
  cloud:
    config:
      enabled: ${CONFIG_CLIENT_ENABLED:false}
      uri: ${CONFIG_URI:https://configserver.example.org}
      username: ${CONFIG_USER:user}
      password: ${CONFIG_PASSWORD:changeit}
      fail-fast: ${CONFIG_CLIENT_FAIL_FAST:true}
      retry:
        initial-interval: ${CONFIG_RETRY_INIT_INTERVAL:3000}
        max-interval: ${CONFIG_RETRY_MAX_INTERVAL:4000}
        max-attempts: ${CONFIG_RETRY_MAX_ATTEMPTS:8}
        multiplier: ${CONFIG_RETRY_MULTIPLIER:1.1}

  messages:
    use-code-as-default-message: true
    fallback-to-system-locale: false
management:
  endpoints:
    web:
      exposure:
        include: "*"
      cors:
        allowed-headers: "*"
        allowed-methods: "*"
        allowed-origins: "*"
  endpoint:
    health:
      show-details: when_authorized
  health:
    mail:
      enabled: false

server:
  port: ${SERVER_PORT:8080}

logging:
  level:
    ROOT: info
    com.netflix.eureka.registry: warn
    com.netflix.discovery.shared.resolver: warn
    org.bremersee: debug
    org.springframework.cloud.configclient: warn

---

spring:
  config:
    activate:
      on-profile: mock

#  security:
#    user:
#      name: Administrator
#      password: demo
#      roles:
#        - "LOCAL_USER"
#        - "ADMIN"
#        - "ACTUATOR_ADMIN"
bremersee:
  dc:
    base-dn: dc=samdom,dc=example,dc=org

---

spring:
  config:
    activate:
      on-profile: local

bremersee:
  ldaptive:
    ldap-url: ${LDAP_URL:ldaps://localhost:636}
  dc:
    cli:
      ssh:
        using-ssh: false

---

spring:
  config:
    activate:
      on-profile: remote

bremersee:
  ldaptive:
    ldap-url: ${LDAP_URL:ldaps://dc1.eixe.bremersee.org:636}
  dc:
    cli:
      ssh:
        using-ssh: true
        ssh-command: ${SSH_COMMAND:ssh root@dc1}

---

spring:
  config:
    activate:
      on-profile: mail
  mail:
    host: smtp.mail.me.com
    port: 587
    test-connection: false
    properties:
      mail.smtp.starttls.enable: true
bremersee:
  dc:
    email:
      sender: christian@bremersee.org

---

spring:
  config:
    activate:
      on-profile: jwt
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: https://openid.bremersee.org/realms/eixe/protocol/openid-connect/certs
bremersee:
  authentication:
    jwt-converter:
      name-json-path: $.preferred_username
      first-name-json-path: $.given_name
      last-name-json-path: $.family_name
      roles-json-path: $.realm_access.roles
      roles-value-list: true
      role-prefix: "ROLE_"
      role-case-transformation: to_upper_case
      role-string-replacements:
        - regex: "[- ]"
          replacement: "_"
        - regex: "_ADMINS"
          replacement: "_ADMIN"

---

spring:
  config:
    activate:
      on-profile: debian

logging:
  file:
    name: /var/log/dc-con/dc-con.log
  logback:
    rollingpolicy:
      max-history: 25

server:
  tomcat:
    accesslog:
      enabled: true
      directory: /var/log/dc-con
      prefix: access_log

spring:
  application:
    name: samba-ad-dc-manager
  profiles:
    active: ${ACTIVE_PROFILES:mock,api}
  cloud:
    config:
      enabled: false
      uri: https://configserver.example.org
      #label: develop
      #username: user
      #password: changeit
      fail-fast: true
      retry:
        initial-interval: 3000
        max-interval: 6000
        max-attempts: 32
        multiplier: 1.1

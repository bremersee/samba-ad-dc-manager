<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en" th:lang="${user.preferredLanguage}">
  <head>
    <title th:remove="all">Your password reset request</title>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8"/>
  </head>
  <body>
    <p>
      <span th:text="#{email.hello}">
        Hello,
      </span>
      <span th:text="${not #strings.isEmpty(user.firstName)} ? ${user.firstName} : ${user.name}">
        James
      </span>
    </p>
    <p>
      <span th:text="#{email.password-reset-email.question}">
        Do you want to reset your password for your account in the domain
      </span>
      <a href="#"
         th:href="${#strings.isEmpty(baseUri) ? '#' : baseUri}"
         th:text="${domain.domainInfo.domain}">
        bremersee.org
      </a>
      <span>?</span>
    </p>
    <p>
      <span th:text="#{email.password-reset-email.reset-password}">
        If so, please click
      </span>
      <a href="#"
         th:href="${resetUri}"
         th:text="#{email.password-reset-email.reset-password.link}">
        here.
      </a>
    </p>
    <p>
      <span th:text="#{email.password-reset-email.valid-for(${lifetimeDays})}">
        The link is valid for 7 days.
      </span>
    </p>
    <p>
      <span th:text="#{email.password-reset-email.login}">
        After you have reset your password, you can log in to
      </span>
      <a href="#"
         th:href="${defaultLoginPage.url}"
         th:text="${defaultLoginPage.name}">
        DATA
      </a>
    </p>
    <p>
      <span>
        ---
      </span>
    </p>
    <p>
      <span th:text="#{email.generated-by}">
        This email was generated by
      </span>
      <a href="https://github.com/bremersee/samba-ad-dc-manager" th:text="#{samba-ad-dc-manager.label}">
        Samba AD DC Manager
      </a>
      <span th:if="${not #strings.isEmpty(baseUri)}" th:text="#{email.generated-on}">
        on
      </span>
      <a th:if="${not #strings.isEmpty(baseUri)}" href="#" th:href="${#strings.isEmpty(baseUri) ? '#' : baseUri}">
        <span th:text="${baseUri}">
          https://bremersee.org
        </span>
      </a>
    </p>
  </body>
</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      lang="en"
      data-bs-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no"/>
  <title th:text="#{user-profile.title(${domainInfo.domain})}">User profile</title>
  <link rel="stylesheet" href="../../static/lib/bootstrap/5.3.3/css/bootstrap.min.css"
        th:href="@{/lib/bootstrap/5.3.3/css/bootstrap.min.css}"/>
  <link rel="stylesheet" href="../../static/lib/bootstrap-social/5.1.1/bootstrap-social.css"
        th:href="@{/lib/bootstrap-social/5.1.1/bootstrap-social.css}"/>
  <link rel="stylesheet" href="../../static/lib/fontawesome/6.5.2/css/fontawesome.min.css"
        th:href="@{/lib/fontawesome/6.5.2/css/fontawesome.css}"/>
  <link rel="stylesheet" href="../../static/lib/fontawesome/6.5.2/css/brands.min.css"
        th:href="@{/lib/fontawesome/6.5.2/css/brands.min.css}"/>
  <link rel="stylesheet" href="../../static/lib/fontawesome/6.5.2/css/solid.min.css"
        th:href="@{/lib/fontawesome/6.5.2/css/solid.min.css}"/>
  <link rel="stylesheet" href="../../static/css/app.css"
        th:href="@{/css/app.css}"/>
  <link rel="stylesheet" href="../../static/css/glyphicons.css"
        th:href="@{/css/glyphicons.css}"/>
  <script src="../../static/lib/jquery/jquery-3.7.1.min.js"
          th:src="@{/lib/jquery/jquery-3.7.1.min.js}"></script>
  <script src="../../static/lib/popper/2.11.8/popper.min.js"
          th:src="@{/lib/popper/2.11.8/popper.min.js}"></script>
  <script src="../../static/lib/bootstrap/5.3.3/js/bootstrap.min.js"
          th:src="@{/lib/bootstrap/5.3.3/js/bootstrap.min.js}"></script>
</head>
<body>
<nav class="navbar navbar-expand-md navbar-dark bg-dark fixed-top"
     th:replace="~{fragments/header :: auth-header}">
  <div class="container-fluid">
    <a class="navbar-brand" href="#">bremersee.org</a>
    <button class="navbar-toggler" type="button"
            data-bs-toggle="collapse"
            data-bs-target="#mainNavbar"
            aria-controls="mainNavbar"
            aria-expanded="false"
            aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="mainNavbar">
    </div>
  </div>
</nav>
<main role="main" class="container">

  <div class="d-flex justify-content-center mb-4">
    <h3 th:text="#{user-profile.header}">Your user profile</h3>
  </div>

  <div class="mx-0 mx-sm-1 mx-md-3">

    <!--suppress ThymeleafVariablesResolveInspection -->
    <div th:if="${rmsg != null}"
         class="alert alert-success mb-4"
         th:class="${rmsg != null} ? ${rmsg.msgType.cssClass} : ''" role="alert"
         th:text="${rmsg != null} ? ${rmsg.msg} : ''">
      Status message
    </div>

    <div class="mb-3">
      <label for="samAccountName" class="form-label" th:text="#{user-profile.username.label}">
        Username
      </label>
      <input type="text" class="form-control" id="samAccountName" name="samAccountName" disabled
             th:value="${user.samAccountName}"/>
    </div>

    <div class="mb-3">
      <label for="firstName" class="form-label" th:text="#{user-profile.firstname.label}">
        First Name
      </label>
      <input type="text" class="form-control" id="firstName" name="firstName" disabled
             th:value="${user.firstName}"/>
    </div>

    <div class="mb-3">
      <label for="lastName" class="form-label" th:text="#{user-profile.lastname.label}">
        Last Name
      </label>
      <input type="text" class="form-control" id="lastName" name="lastName" disabled
             th:value="${user.lastName}"/>
    </div>

    <form th:action="@{profile}" th:object="${editModel}" action="#" method="post"
          th:if="${not #strings.isEmpty(user.email)}">

      <div class="mb-3">
        <label for="email" class="form-label" th:text="#{user-profile.email.label}">
          Email
        </label>
        <input type="email" class="form-control" id="email" name="email" required
               aria-describedby="emailHelp" th:field="*{newEmail}"
               th:disabled="${not userAbleToChangeEmail}"
               th:required="${userAbleToChangeEmail}"
               th:classappend="${#fields.hasErrors('newEmail')} ? 'is-invalid' : ''"/>
        <div id="emailHelp" class="form-text" th:text="#{user-profile.email.help}">
          If you wish, you can change your email address.
          The system will send an email to the new address, which you must confirm.
        </div>
        <div id="emailValidation" class="invalid-feedback"
             th:text="${#fields.hasErrors('newEmail')} ? ${#fields.errors('newEmail')[0]} : ''">
        </div>
      </div>

      <button type="submit" class="btn btn-primary mt-3 mb-5" th:if="${userAbleToChangeEmail}">
        <span th:text="#{user-profile.change-email.label}">
          Change email
        </span>
      </button>
    </form>

  </div>

</main>
<script type="text/javascript" th:inline="javascript">
  //<![CDATA[
  "use strict";
  $(document).ready(function () {
  });
  //]]>
</script>
</body>
</html>
